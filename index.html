<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local AI Chat</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
        #chatBox { height: 60vh; border: 1px solid #ccc; border-radius: 8px; overflow-y: auto; padding: 15px; margin-bottom: 10px; background: #f9f9f9; }
        .message { margin-bottom: 10px; padding: 10px 14px; border-radius: 15px; max-width: 80%; line-height: 1.4; }
        .user { background: #007bff; color: white; margin-left: auto; border-bottom-right-radius: 2px; }
        .ai { background: #e9ecef; color: black; margin-right: auto; border-bottom-left-radius: 2px; }
        .controls { display: flex; gap: 8px; margin-bottom: 10px; }
        select, input, button { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        select { flex: 1; }
        .input-area { display: flex; gap: 8px; }
        input { flex: 1; }
        button { background: #007bff; color: white; border: none; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Llama 3 Local</h2>
    <div class="controls">
        <select id="voiceSelect"><option>Loading voices...</option></select>
    </div>
    <div id="chatBox"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Message AI..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        let messageHistory = [];
        let voices = [];
        const voiceSelect = document.getElementById('voiceSelect');

        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
            voiceSelect.innerHTML = voices.map((v, i) => `<option value="${i}">${v.name} (${v.lang})</option>`).join('');
        }
        
        window.speechSynthesis.onvoiceschanged = loadVoices;
        setTimeout(loadVoices, 500);
        
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();
            if (!text) return;

            chatBox.innerHTML += `<div class="message user">${text}</div>`;
            messageHistory.push({ role: "user", content: text });
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('http://127.0.0.1:3000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: messageHistory })
                });
                
                const data = await response.json();
                
                if (data.reply) {
                    chatBox.innerHTML += `<div class="message ai">${data.reply}</div>`;
                    messageHistory.push({ role: "assistant", content: data.reply });
                    
                    const utterance = new SpeechSynthesisUtterance(data.reply);
                    const selectedVoiceIndex = voiceSelect.value;
                    if (voices[selectedVoiceIndex]) {
                        utterance.voice = voices[selectedVoiceIndex];
                    }
                    window.speechSynthesis.speak(utterance);
                } else {
                    chatBox.innerHTML += `<div class="message ai" style="color: red;">Error: Could not get reply.</div>`;
                }
            } catch (error) {
                chatBox.innerHTML += `<div class="message ai" style="color: red;">Connection Error. Is the Node server running?</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
